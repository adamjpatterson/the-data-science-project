name: Project integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
  workflow_call:
    inputs:
      template_branch:
        required: true
        type: string
      template_ref:
        required: true
        type: string

jobs:
  integration:
    name: Generated projects on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.8', '3.11', '3.13', '3.14']
        include:
          - os: windows-2025
            python: '3.13'
          - os: macos-15
            python: '3.13'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.template_branch != '' && 'main' || github.sha }}
          fetch-depth: 0
      - name: Check out the triggering template commit
        if: inputs.template_branch != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.template_ref }}
          path: .ci-template
      - name: Install target Python
        id: target
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-runner Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Export exact template sources
        env:
          TEMPLATE_BRANCH: ${{ inputs.template_branch }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          branches = ("installable_imrad_project_cookiecutter", "imrad_project_cookiecutter")
          triggering_branch = os.environ["TEMPLATE_BRANCH"]
          if triggering_branch and triggering_branch not in branches:
              raise ValueError(f"Unknown template branch: {triggering_branch}")
          subprocess.run([
              "git", "fetch", "origin",
              *(f"{branch}:refs/remotes/origin/{branch}" for branch in branches),
          ], check=True)
          sources = Path(os.environ["RUNNER_TEMP"]) / "project-test-sources"
          sources.mkdir()
          for branch in branches:
              checkout = ".ci-template" if branch == triggering_branch else "."
              ref = "HEAD" if branch == triggering_branch else f"refs/remotes/origin/{branch}"
              subprocess.run(["git", "-C", checkout, "rev-parse", ref], check=True)
              archive = sources.parent / f"{branch}.tar"
              subprocess.run([
                  "git", "-C", checkout, "archive", "--output", str(archive), ref,
              ], check=True)
              target = sources / branch
              target.mkdir()
              with tarfile.open(archive) as stream:
                  stream.extractall(target, filter="data")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"PROJECT_TEST_SOURCES={sources}\n")
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest -v tests
        env:
          PROJECT_TEST_PYTHON: ${{ steps.target.outputs.python-path }}

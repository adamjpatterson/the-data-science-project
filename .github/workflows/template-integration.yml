name: Template integration tests

on:
  push:
    branches: [imrad_project_cookiecutter]
  pull_request:
    branches: [imrad_project_cookiecutter]

permissions:
  contents: read

jobs:
  integration:
    uses: adamjpatterson/the-data-science-project/.github/workflows/integration.yml@main
    with:
      template_branch: imrad_project_cookiecutter
      template_ref: ${{ github.sha }}
